media:
  input: "dist"
  output: "/"
  extensions: ["jpg","jpeg","png","webp","avif"]
content:
  - name: "services"
    label: "중개 서비스"
    type: "collection"
    path: "content/services"
    format: "json"
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}-{primary}.json"
    view: {"primary":"title","fields":["title","order"],"sort":"order","order":"asc"}
    fields:
      - {"name":"title","label":"서비스명","type":"string","required":true}
      - {"name":"audience","label":"이런 분께","type":"text","required":true}
      - {"name":"check","label":"함께 확인","type":"text","required":true}
      - {"name":"prepare","label":"상담 준비","type":"text","required":true}
      - {"name":"order","label":"표시 순서 (작은 숫자부터)","type":"number","required":true}
  - name: "insights"
    label: "상권 인사이트"
    type: "collection"
    path: "content/insights"
    format: "json"
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}-{primary}.json"
    view: {"primary":"title","fields":["title","order"],"sort":"order","order":"asc"}
    fields:
      - {"name":"category","label":"게시판 (market / faq / news)","type":"string","required":false}
      - {"name":"published","label":"게시일","type":"date","required":false}
      - {"name":"source","label":"NEWS 원문 주소 (https://)","type":"string","required":false}
      - {"name":"title","label":"글 제목","type":"string","required":true}
      - {"name":"body","label":"본문","type":"text","required":true}
      - {"name":"image","label":"대표 사진","type":"image","required":false}
      - {"name":"alt","label":"사진 설명","type":"string","required":false}
      - {"name":"order","label":"표시 순서 (작은 숫자부터)","type":"number","required":true}
  - name: "projects"
    label: "중개 사례·고객 후기"
    type: "collection"
    path: "content/projects"
    format: "json"
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}-{primary}.json"
    view: {"primary":"title","fields":["title","order"],"sort":"order","order":"asc"}
    fields:
      - {"name":"title","label":"사례 제목","type":"string","required":true}
      - {"name":"category","label":"상담 분야 (서비스명과 동일하게)","type":"string","required":true}
      - {"name":"body","label":"사례 본문","type":"text","required":true}
      - {"name":"image","label":"매물 사진","type":"image","required":false}
      - {"name":"caption","label":"사진 캡션","type":"string","required":false}
      - {"name":"poster","label":"포스터 이미지","type":"image","required":false}
      - {"name":"order","label":"표시 순서 (작은 숫자부터)","type":"number","required":true}
  - name: "listings"
    label: "단독 보유 매물"
    type: "collection"
    path: "content/listings"
    format: "json"
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}-{primary}.json"
    view: {"primary":"title","fields":["title","order"],"sort":"order","order":"asc"}
    fields:
      - {"name":"title","label":"매물 제목","type":"string","required":true}
      - {"name":"category","label":"상담 분야 (서비스명과 동일하게)","type":"string","required":true}
      - {"name":"body","label":"매물 소개","type":"text","required":true}
      - {"name":"image","label":"매물 사진","type":"image","required":false}
      - {"name":"caption","label":"사진 캡션","type":"string","required":false}
      - {"name":"poster","label":"포스터 이미지","type":"image","required":false}
      - {"name":"order","label":"표시 순서 (작은 숫자부터)","type":"number","required":true}
  - name: "deal-history"
    label: "공개 중개 실적"
    type: "collection"
    path: "content/deal-history"
    format: "json"
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}-{primary}.json"
    view: {"primary":"title","fields":["title","year","month"],"sort":"year","order":"desc"}
    fields:
      - {"name":"title","label":"사례 제목 (공개용)","type":"string","required":true}
      - {"name":"year","label":"체결 연도","type":"number","required":true}
      - {"name":"month","label":"체결 월 (1–12)","type":"number","required":true}
      - {"name":"transaction","label":"거래 구분 (매매 / 임대 / 재계약 등)","type":"string","required":true}
      - {"name":"use","label":"공간 유형 (상가 / 사무실 / 병의원 등)","type":"string","required":true}
      - {"name":"industry","label":"업종 (뷰티 / 패션 / F&B 등)","type":"string","required":true}
      - {"name":"area","label":"공개 지역 (예: 압구정로데오 일대)","type":"string","required":true}
      - {"name":"publicName","label":"공개 허락받은 상호명 (선택)","type":"string","required":false}
      - {"name":"publicAddress","label":"공개 허락받은 주소 (선택)","type":"string","required":false}
