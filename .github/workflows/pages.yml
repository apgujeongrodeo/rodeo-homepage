name: Publish Rodeo Homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
  discussion:
    types: [created, edited, deleted, category_changed]
  discussion_comment:
    types: [created, deleted]
permissions:
  contents: read
  actions: read
  discussions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Read public Q&A
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api graphql -f 'query=query { repository(owner:"apgujeongrodeo",name:"rodeo-homepage") { discussions(first:10,categoryId:"DIC_kwDOV5h_LM4DL18a",orderBy:{field:CREATED_AT,direction:DESC}) { nodes { title url createdAt comments { totalCount } } } } }' --jq '.data.repository.discussions.nodes' > questions_snapshot.tmp; then
            mv questions_snapshot.tmp questions_snapshot.json
          fi
      - run: python3 render_cms.py
      - name: Set repository site base path
        env:
          BASE: /${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          base = os.environ["BASE"]
          for path in Path("dist").rglob("*.html"):
              source = path.read_text(encoding="utf-8")
              source = re.sub(r'((?:href|src|action)="/)(?!/)', lambda match: match[1][:-1] + base + "/", source)
              path.write_text(source, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q .; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment


